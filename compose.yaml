services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtmc-api
    image: rtmc-ai-assistant:latest
    environment:
      RTMC_ENVIRONMENT: local-docker
      RTMC_LOG_LEVEL: INFO
      RTMC_PRIVACY_NOTICE_VERSION: demo-privacy-v1
      GOVERNED_COMPLAINT_WORKFLOW_ENABLED: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      DATABASE_URL: ${DATABASE_URL:-postgresql://rtmc:rtmc@db:5432/rtmc}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.example
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: rtmc-db
    environment:
      POSTGRES_USER: rtmc
      POSTGRES_PASSWORD: rtmc
      POSTGRES_DB: rtmc
    volumes:
      - rtmc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtmc -d rtmc"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  rtmc-db-data:
