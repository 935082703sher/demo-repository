[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rtmc-ai-assistant"
version = "0.2.0"
description = "Controlled local Demo 2 backend for grounded RTMC guidance and complaint preparation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

# The kb/ pipeline is a separate, self-contained package (its own entry points
# and scripts); it is not part of the strictly typed application surface.
[[tool.mypy.overrides]]
module = ["kb.*"]
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"
