<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RTMC AI Assistant — Diagnostika</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1c1e21; --muted: #6b7280;
    --line: #e5e7eb; --brand: #1f6feb; --brand-ink: #ffffff;
    --ai: #eef2ff; --user: #1f6feb; --card: #f0fdf4; --card-line: #bbf7d0;
    --warn-bg: #fff8e1; --warn-line: #f0d98c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --ink: #e6e8eb; --muted: #9aa4b2;
      --line: #262b34; --ai: #1c2333; --card: #10251a; --card-line: #1f5c3a;
      --warn-bg: #2a2410; --warn-line: #5c4d1f;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 1rem; margin: 0; flex: 1; }
  header .sub { color: var(--muted); font-size: 0.72rem; font-weight: 400; }
  select, .reset {
    font: inherit; font-size: 0.85rem; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  main {
    flex: 1; overflow-y: auto; padding: 16px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .banner {
    background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px;
    padding: 8px 12px; font-size: 0.75rem; margin-bottom: 14px; color: var(--ink);
  }
  .row { display: flex; margin: 8px 0; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 13px; border-radius: 14px; line-height: 1.45;
    font-size: 0.92rem; white-space: pre-wrap; word-wrap: break-word;
  }
  .row.ai .bubble { background: var(--ai); border-bottom-left-radius: 4px; }
  .row.user .bubble { background: var(--user); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px 0; }
  .opt {
    font: inherit; font-size: 0.86rem; padding: 8px 12px; border-radius: 999px;
    border: 1px solid var(--brand); background: transparent; color: var(--brand); cursor: pointer;
  }
  .opt:hover { background: var(--brand); color: var(--brand-ink); }
  .card {
    background: var(--card); border: 1px solid var(--card-line); border-radius: 12px;
    padding: 14px; margin: 8px 0; font-size: 0.9rem;
  }
  .card h3 { margin: 0 0 6px 0; font-size: 0.98rem; }
  .card .cause { color: var(--muted); margin-bottom: 10px; }
  .card ol { margin: 6px 0; padding-left: 20px; }
  .card li { margin: 4px 0; }
  .card .meta { margin-top: 10px; font-size: 0.82rem; }
  .card .meta div { margin: 3px 0; }
  .card a { color: var(--brand); }
  .imgs { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 10px 0; }
  .shot { margin: 0; max-width: 240px; }
  .shot img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .shot figcaption { color: var(--muted); font-size: 0.72rem; margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .callwrap { margin: 8px 0 12px 0; }
  .call-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--brand);
    color: var(--brand-ink); text-decoration: none; padding: 10px 16px; border-radius: 10px;
    font-weight: 600; font-size: 0.95rem; }
  .call-btn:hover { filter: brightness(0.95); }
  .chip { font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .escalate { color: #b45309; }
  footer {
    background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px;
  }
  .inputbar { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
  #msg {
    flex: 1; font: inherit; font-size: 0.95rem; padding: 11px 14px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  #send {
    font: inherit; padding: 0 18px; border-radius: 12px; border: none;
    background: var(--brand); color: var(--brand-ink); cursor: pointer; font-weight: 600;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 0.85rem; font-style: italic; }
</style>
</head>
<body>
  <header>
    <div style="flex:1">
      <h1>RTMC AI Assistant <span class="sub">— IMEI / MNP diagnostika (demo)</span></h1>
    </div>
    <select id="lang" aria-label="Til">
      <option value="uz">O‘zbekcha</option>
      <option value="uz_cyrl">Ўзбекча</option>
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="kaa">Qaraqalpaqsha</option>
    </select>
    <button class="reset" id="reset">Qayta</button>
  </header>

  <main id="log">
    <div class="banner" id="banner">
      Demo. Rasmiy murojaatni ro‘yxatga olmaydi va shaxsiy ma’lumot so‘ramaydi.
    </div>
  </main>

  <footer>
    <div class="inputbar">
      <input id="msg" autocomplete="off" placeholder="Muammoingizni yozing… (masalan: IMEI ro‘yxatdan o‘tmayapti)" />
      <button id="send">Yuborish</button>
    </div>
  </footer>

<script>
(() => {
  "use strict";
  const log = document.getElementById("log");
  const input = document.getElementById("msg");
  const sendBtn = document.getElementById("send");
  const langSel = document.getElementById("lang");
  const resetBtn = document.getElementById("reset");

  function newSession() {
    return (crypto.randomUUID ? crypto.randomUUID() : "s-" + Date.now() + "-" + Math.random().toString(16).slice(2));
  }
  const state = { session_id: newSession(), lang: "uz" };

  const T = {
    uz: { welcome: "Assalomu alaykum! IMEI yoki MNP bo‘yicha muammoingizni yozing. Masalan: «IMEI ro‘yxatdan o‘tmayapti», «telefonim bloklandi», «raqamni boshqa operatorga ko‘chirmoqchiman».",
          placeholder: "Muammoingizni yozing…", send: "Yuborish", reset: "Qayta",
          cause: "Ehtimoliy sabab", steps: "Nima qilish kerak", docs: "Kerakli hujjatlar",
          where: "Qayerga murojaat", url: "Rasmiy manzil", contact: "Kontakt",
          escalate: "Operatorga yo‘naltirish", sources: "Manbalar", human: "Operatorga ulanish tavsiya etiladi.",
          typing: "yozmoqda…", fbQ: "Muammo hal bo‘ldimi?", fbYes: "Ha 👍", fbNo: "Yo‘q 👎", fbThanks: "Rahmat!" },
    ru: { welcome: "Здравствуйте! Опишите проблему по IMEI или MNP. Например: «IMEI не регистрируется», «телефон заблокирован», «хочу перенести номер к другому оператору».",
          placeholder: "Опишите проблему…", send: "Отправить", reset: "Заново",
          cause: "Вероятная причина", steps: "Что делать", docs: "Нужные документы",
          where: "Куда обратиться", url: "Официальный адрес", contact: "Контакт",
          escalate: "Передача оператору", sources: "Источники", human: "Рекомендуется связаться с оператором.",
          typing: "печатает…", fbQ: "Проблема решена?", fbYes: "Да 👍", fbNo: "Нет 👎", fbThanks: "Спасибо!" },
    uz_cyrl: { welcome: "Ассалому алайкум! IMEI ёки MNP бўйича муаммоингизни ёзинг. Масалан: «IMEI рўйхатдан ўтмаяпти», «телефоним блокланди».",
          placeholder: "Муаммоингизни ёзинг…", send: "Юбориш", reset: "Қайта",
          cause: "Эҳтимолий сабаб", steps: "Нима қилиш керак", docs: "Керакли ҳужжатлар",
          where: "Қаерга мурожаат", url: "Расмий манзил", contact: "Контакт",
          escalate: "Операторга йўналтириш", sources: "Манбалар", human: "Операторга уланиш тавсия этилади.",
          typing: "ёзмоқда…", fbQ: "Муаммо ҳал бўлдими?", fbYes: "Ҳа 👍", fbNo: "Йўқ 👎", fbThanks: "Раҳмат!" },
    en: { welcome: "Hello! Describe your IMEI or MNP problem. For example: “IMEI is not registering”, “my phone is blocked”.",
          placeholder: "Describe your problem…", send: "Send", reset: "Reset",
          cause: "Likely reason", steps: "What to do", docs: "Documents needed",
          where: "Where to apply", url: "Official link", contact: "Contact",
          escalate: "Route to operator", sources: "Sources", human: "It's best to contact an operator.",
          typing: "typing…", fbQ: "Did this solve it?", fbYes: "Yes 👍", fbNo: "No 👎", fbThanks: "Thank you!" },
    kaa: { welcome: "Assalawma áleykum! IMEI yamasa MNP boyınsha máseleńizdi jazıń. Mısalı: «IMEI dizimnen ótpey atır», «telefonım bloklandı».",
          placeholder: "Máseleńizdi jazıń…", send: "Jiberiw", reset: "Qayta",
          cause: "Múmkin sebep", steps: "Ne islew kerek", docs: "Kerekli hújjetler",
          where: "Qayerge múrájat", url: "Rásmiy sıltama", contact: "Baylanıs",
          escalate: "Operatorǵa jiberiw", sources: "Derekler", human: "Operator menen baylanısıw usınıladı.",
          typing: "jazıp atır…", fbQ: "Másele sheshildi me?", fbYes: "Awa 👍", fbNo: "Yaq 👎", fbThanks: "Raxmet!" }
  };

  function tr() { return T[state.lang]; }

  // Label for the final 1170 call button (the number itself comes from the server).
  const CALL_LABEL = {
    uz: "ga qo‘ng‘iroq qilish",
    uz_cyrl: "га қўнғироқ қилиш",
    ru: "— позвонить",
    en: "— call",
    kaa: "ge qońıraw qılıw"
  };

  // Confirmation shown when the user switches language by typing (not the dropdown).
  const SWITCHED = {
    uz: "Til o‘zbekchaga (lotin) o‘zgartirildi. Savolingizni yozing.",
    uz_cyrl: "Тил ўзбекчага (кирилл) ўзгартирилди. Саволингизни ёзинг.",
    ru: "Язык переключён на русский. Напишите ваш вопрос.",
    en: "Language switched to English. Please type your question.",
    kaa: "Til qaraqalpaqshaǵa ózgertirildi. Sorawıńızdı jazıń."
  };

  // Mirror of the Telegram bot: a plain message like "qoraqalpoqcha gapir" switches
  // language only when a language name appears with a short message or a switch
  // intent, so an ordinary sentence that merely mentions a word does not flip it.
  function requestedLanguage(text) {
    const low = text.toLowerCase().replace(/[‘’`]/g, "'");
    const stripped = low.trim();
    if (["uz", "uz_cyrl", "ru", "en", "kaa"].includes(stripped)) return stripped;
    const short = stripped.split(/\s+/).length <= 3;
    const intent = ["gapir","til","javob","yoz","speak","write","answer","reply",
      "switch","language","язык","ответ","перейд","напиш","пиши"].some(w => low.includes(w));
    if (!(short || intent)) return null;
    const tokens = [
      ["kaa", ["qoraqalp","qaraqalp","karakalp","қарақалп","каракалп"]],
      ["ru", ["ruscha","rus tili","русск","по-русски","по русски"]],
      ["en", ["inglizcha","ingliz tili","english","английск"]],
      ["uz_cyrl", ["kirill","кирилл","uzcyrl"]],
      ["uz", ["o'zbekcha","ozbekcha","узбекча","lotincha","lotin tili","latin"]]
    ];
    for (const [code, toks] of tokens) if (toks.some(t => low.includes(t))) return code;
    return null;
  }

  function scroll() { log.scrollTop = log.scrollHeight; }

  function bubble(role, text) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    row.appendChild(b);
    log.appendChild(row);
    scroll();
    return row;
  }

  function renderOptions(options) {
    if (!options || !options.length) return;
    const wrap = document.createElement("div");
    wrap.className = "options";
    for (const o of options) {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.textContent = o.label;
      btn.onclick = () => { disableOptions(wrap); sendOption(o.value, o.label); };
      wrap.appendChild(btn);
    }
    log.appendChild(wrap);
    scroll();
  }

  function disableOptions(wrap) {
    wrap.querySelectorAll("button").forEach(b => { b.disabled = true; b.style.opacity = "0.5"; });
  }

  function typing(on) {
    let el = document.getElementById("typing");
    if (on) {
      if (!el) { el = document.createElement("div"); el.id = "typing"; el.className = "typing"; el.textContent = tr().typing; log.appendChild(el); scroll(); }
    } else if (el) { el.remove(); }
  }

  async function streamTurn(message) {
    typing(true); sendBtn.disabled = true;
    let aiText = null, meta = null;
    const ensureBubble = () => {
      if (!aiText) { typing(false); aiText = bubble("ai", "").querySelector(".bubble"); }
      return aiText;
    };
    try {
      const res = await fetch("/assistant/converse/stream", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: state.session_id, language: state.lang, channel: "web" })
      });
      if (!res.ok || !res.body) throw new Error("http " + res.status);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const line = buf.slice(0, idx).split("\n").find(l => l.startsWith("data: "));
          buf = buf.slice(idx + 2);
          if (!line) continue;
          const evt = JSON.parse(line.slice(6));
          if (evt.type === "delta") { ensureBubble().textContent += evt.text; scroll(); }
          else if (evt.type === "done") { meta = evt; }
        }
      }
      typing(false);
      if (meta) finishTurn(meta);
    } catch (e) {
      typing(false);
      bubble("ai", state.lang === "ru"
        ? "Ошибка связи с сервером. Попробуйте ещё раз."
        : "Server bilan bog‘lanishda xatolik. Qayta urinib ko‘ring.");
    } finally { sendBtn.disabled = false; input.focus(); }
  }

  function finishTurn(meta) {
    if (meta.call_1170) { renderCall1170(meta.phone); renderFeedback(meta.card_id); return; }
    if (meta.requires_human) { bubble("ai", tr().human); renderSources(meta.sources); return; }
    if (meta.done) { renderImages(meta.images); renderSources(meta.sources); renderFeedback(meta.card_id); return; }
    renderOptions(meta.options);
  }

  function renderCall1170(phone) {
    if (!phone) return;
    const wrap = document.createElement("div");
    wrap.className = "callwrap";
    const a = document.createElement("a");
    a.className = "call-btn";
    a.href = "tel:" + phone;
    a.textContent = "📞 " + phone + " " + (CALL_LABEL[state.lang] || CALL_LABEL.uz);
    wrap.appendChild(a);
    log.appendChild(wrap);
    scroll();
  }

  function renderImages(images) {
    if (!images || !images.length) return;
    const wrap = document.createElement("div");
    wrap.className = "imgs";
    for (const im of images) {
      const fig = document.createElement("figure");
      fig.className = "shot";
      const img = document.createElement("img");
      img.src = im.url; img.alt = im.caption || ""; img.loading = "lazy";
      const cap = document.createElement("figcaption");
      cap.textContent = im.caption || "";
      fig.appendChild(img); fig.appendChild(cap);
      wrap.appendChild(fig);
    }
    log.appendChild(wrap);
    scroll();
  }

  function renderFeedback(cardId) {
    const wrap = document.createElement("div");
    wrap.className = "options";
    const q = document.createElement("span");
    q.className = "chip"; q.textContent = tr().fbQ;
    wrap.appendChild(q);
    for (const [label, helpful] of [[tr().fbYes, true], [tr().fbNo, false]]) {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.textContent = label;
      btn.onclick = async () => {
        wrap.querySelectorAll("button").forEach(b => { b.disabled = true; b.style.opacity = "0.5"; });
        try {
          const r = await fetch("/assistant/feedback", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: state.session_id, helpful, card_id: cardId || null, language: state.lang, channel: "web" })
          });
          const d = await r.json();
          const t = document.createElement("span");
          t.className = "chip"; t.textContent = (d && d.reply) || tr().fbThanks;
          wrap.appendChild(t);
        } catch (e) { /* feedback is best-effort */ }
      };
      wrap.appendChild(btn);
    }
    log.appendChild(wrap);
    scroll();
  }

  function renderSources(sources) {
    if (!sources || !sources.length) return;
    const seen = new Set();
    const uniq = sources.filter(s => !seen.has(s.doc_id) && seen.add(s.doc_id));
    const wrap = document.createElement("div");
    wrap.className = "chips";
    const label = document.createElement("span");
    label.className = "chip";
    label.textContent = tr().sources + ":";
    wrap.appendChild(label);
    for (const s of uniq) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = s.title || s.doc_id;
      wrap.appendChild(chip);
    }
    log.appendChild(wrap);
    scroll();
  }

  async function sendText() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    bubble("user", text);
    // A typed language request switches the selector instead of asking the brain.
    const req = requestedLanguage(text);
    if (req) {
      langSel.value = req;
      applyLang();
      bubble("ai", SWITCHED[req]);
      return;
    }
    await streamTurn(text);
  }

  async function sendOption(value, label) {
    bubble("user", label);
    await streamTurn(value);
  }

  function reset() {
    state.session_id = newSession();
    log.querySelectorAll(".row, .options, .card, .chips, .imgs, .callwrap, #typing").forEach(e => e.remove());
    bubble("ai", tr().welcome);
  }

  function applyLang() {
    state.lang = langSel.value;
    input.placeholder = tr().placeholder;
    sendBtn.textContent = tr().send;
    resetBtn.textContent = tr().reset;
    document.getElementById("banner").textContent = state.lang === "ru"
      ? "Демо. Не регистрирует официальное обращение и не запрашивает личные данные."
      : "Demo. Rasmiy murojaatni ro‘yxatga olmaydi va shaxsiy ma’lumot so‘ramaydi.";
  }

  sendBtn.onclick = sendText;
  input.onkeydown = (e) => { if (e.key === "Enter") sendText(); };
  resetBtn.onclick = reset;
  langSel.onchange = () => { applyLang(); reset(); };

  applyLang();
  bubble("ai", tr().welcome);
  input.focus();
})();
</script>
</body>
</html>
